  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, yes]
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
  job-storage:
  model-cache:

